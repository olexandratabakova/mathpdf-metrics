[project]
name = "flashcard-evaluator"
version = "0.1.0"
description = "LLM-based flashcard quality evaluator"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50.0",
    "openpyxl>=3.1.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "rapidfuzz>=3.9.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "tiktoken>=0.7.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
evaluate = "flashcard_evaluator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
